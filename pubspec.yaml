name: discipline_tracker
description: "A production-ready mobile application for building consistency, tracking daily habits, maintaining streaks, and visualizing progress with GitHub-style heatmaps."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Firebase Suite
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  google_sign_in: ^7.2.0

  # Local Offline Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^16.3.2
  timezone: ^0.9.2

  # Charts & Visualization
  fl_chart: ^0.66.0

  # PDF Export & Printing
  pdf: ^3.10.7
  printing: ^5.11.1
  path_provider: ^2.1.2

  # Utilities & UI Enhancements
  intl: ^0.19.0
  uuid: ^4.3.3
  google_fonts: ^6.1.0
  percent_indicator: ^4.2.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
